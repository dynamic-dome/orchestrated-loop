[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrated-loop"
version = "0.1.0"
description = "Adapter-agnostischer 4-Rollen-Loop mit persistierenden State-Dateien."
requires-python = ">=3.10"
dependencies = [
    "tomli; python_version<'3.11'",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
openai = ["httpx>=0.27"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
orchestrated-loop = "orchestrated_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
